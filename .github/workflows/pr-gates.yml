# pr-gates.yml — swarm PR gate reusable workflow (workflow_call)
#
# Runs reviewer and security agents in parallel on a swarm PR.
#
# QA note: pr-gates does NOT run a swarm QA agent. QA = consumer-declared
# required checks. Consumers declare which CI checks gate merge via branch
# protection rules; the swarm pipeline does not re-run the consumer's test
# suite. A dedicated swarm QA agent is planned for #10.
#
# SWARM_TOKEN requirement: consumers MUST provision a SWARM_TOKEN secret
# pointing to a fine-grained PAT with pull-requests:write scope for a
# distinct actor. GITHUB_TOKEN cannot approve a PR it opened (SPEC §6).
# On dry-run=true, SWARM_TOKEN is not required.
#
# Caller-input surface:
#   pr              (number, required)            PR number to review.
#   issue           (number, required)            Issue number being implemented.
#   runner-label    (string, default: swarm-agent)
#   dry-run         (boolean, default: false)
#   adapter         (string, default: claude)     Agent adapter forwarded to agent-run.
#   model           (string, default: "")         LLM model identifier.
#   maintainer      (string, default: "")         Reserved; unused in this workflow.
#   qa-required-checks (string, default: "")      Reserved — pending #10.
#   enabled-sinks   (string, default: "")         Comma-separated notify sinks. Derived from load-config.
#   buzz-channel    (string, default: "")         Buzz/Nostr channel UUID. Derived from load-config.
#   engine-repo     (string, default: benmarte/swarm) Engine repository (org/repo). Override for forks.
#   engine-ref      (string, default: v1)          Engine ref (tag, branch, or SHA) checked out into .swarm-engine/.
#                                                   Must match the ref used in `uses: <repo>/.github/workflows/...@<ref>`.
#
# Secrets:
#   SWARM_TOKEN     Fine-grained PAT with pull-requests:write for a distinct actor.
#                   Required for reviewer-post job when dry-run is false.
#
# Permissions per job:
#   reviewer job    : contents: read, pull-requests: read (checkout + gh pr diff)
#   reviewer-post   : contents: read, pull-requests: write (post PR review via SWARM_TOKEN)
#   security job    : contents: read, pull-requests: read (checkout + gh pr diff)
#   security-post   : contents: read, pull-requests: write, issues: read (post PR comment)
#   merge job       : contents: write, pull-requests: write, issues: write (squash-merge + transition)
#
# merge job — swarm-approval environment gate:
#   After reviewer-post and security-post succeed, the merge job pauses for a
#   human "Review deployments" approval (swarm-approval environment). On approval,
#   pre-merge verification runs, then gh pr merge --squash --delete-branch via
#   SWARM_TOKEN. A PAT-authored merge is required so pull_request:closed fires the
#   docs.yml cascade (GITHUB_TOKEN merges are suppressed by GitHub's recursion guard).

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to review.
        required: true
        type: number
      issue:
        description: Issue number being implemented.
        required: true
        type: number
      runner-label:
        description: Runner label for agent jobs. Glue jobs always use ubuntu-latest.
        required: false
        type: string
        default: swarm-agent
      dry-run:
        description: When true, log intended mutations without executing them.
        required: false
        type: boolean
        default: false
      adapter:
        description: Agent adapter forwarded to agent-run (claude or openai-compat).
        required: false
        type: string
        default: claude
      model:
        description: LLM model identifier set as SWARM_LLM_MODEL.
        required: false
        type: string
        default: ""
      maintainer:
        description: Reserved — unused in pr-gates; present for caller-input consistency.
        required: false
        type: string
        default: ""
      qa-required-checks:
        description: >
          Comma-separated check names declared by the consumer as required for merge.
          Reserved — full wiring pending #10; currently unused.
        required: false
        type: string
        default: ""
      enabled-sinks:
        description: Comma-separated notify sinks (slack,buzz,discord,teams). Derived from load-config; passed to transition on merge for notify fan-out.
        required: false
        type: string
        default: ""
      buzz-channel:
        description: Buzz/Nostr channel UUID. Derived from load-config; passed to transition on merge for notify fan-out.
        required: false
        type: string
        default: ""
      engine-repo:
        description: Engine repository (org/repo). Override for forks.
        required: false
        type: string
        default: benmarte/swarm
      engine-ref:
        description: Engine ref (tag, branch, or SHA) to check out into .swarm-engine/. Must match the ref pinned in the caller uses directive.
        required: false
        type: string
        default: v1
    secrets:
      SWARM_TOKEN:
        description: >
          Fine-grained PAT with pull-requests:write and issues:write scope for a
          distinct actor. Required when dry-run is false for the reviewer job to
          post a real PR review. The issues:write scope is needed for stage-label
          cascade transitions in other workflows that share this secret.
        required: false
      SWARM_LLM_API_KEY:
        description: >
          Bearer token for the OpenAI-compatible LLM endpoint.
          Optional — omit for local endpoints that need no authentication.
        required: false
      SWARM_SLACK_WEBHOOK:
        description: Slack incoming webhook URL for notify fan-out. Required when slack is in enabled-sinks (webhook mode).
        required: false
      SWARM_SLACK_BOT_TOKEN:
        description: Slack bot token for notify fan-out. Required when slack is in enabled-sinks (bot-token mode).
        required: false
      SWARM_DISCORD_WEBHOOK:
        description: Discord webhook URL for notify fan-out. Required when discord is in enabled-sinks (webhook mode).
        required: false
      SWARM_DISCORD_BOT_TOKEN:
        description: Discord bot token for notify fan-out. Required when discord is in enabled-sinks (bot-token mode).
        required: false
      SWARM_TEAMS_WEBHOOK:
        description: Microsoft Teams webhook URL for notify fan-out. Required when teams is in enabled-sinks.
        required: false
      SWARM_BUZZ_RELAY_URL:
        description: Buzz/Nostr relay wss:// URL for notify fan-out. Required when buzz is in enabled-sinks.
        required: false
      SWARM_BUZZ_PRIVATE_KEY:
        description: Nostr private key (hex or nsec) for the buzz adapter. Required when buzz is in enabled-sinks.
        required: false

concurrency:
  group: swarm-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  # ── Reviewer agent (parallel with security) ───────────────────────────────
  reviewer:
    name: Reviewer agent
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.read-outcome.outputs.verdict }}
      summary: ${{ steps.read-outcome.outputs.summary }}
      details: ${{ steps.read-outcome.outputs.details }}
      comments-enabled: ${{ steps.config.outputs.comments-enabled }}
      enabled-sinks: ${{ steps.config.outputs.enabled-sinks }}
      notify-buzz-channel: ${{ steps.config.outputs.notify-buzz-channel }}
      notify-slack-channel: ${{ steps.config.outputs.notify-slack-channel }}
      notify-discord-channel: ${{ steps.config.outputs.notify-discord-channel }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_LLM_MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      - name: Fetch PR diff and metadata
        id: ctx
        env:
          PR_NUMBER: ${{ inputs.pr }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          pr_meta="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{title: .title, body: .body, head_sha: .head.sha}')"

          pr_diff="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --header "Accept: application/vnd.github.v3.diff")"

          context_json="$(printf '%s' "$pr_meta" | jq \
            --argjson pr "$PR_NUMBER" \
            --argjson issue "$ISSUE_NUMBER" \
            --arg diff "$pr_diff" \
            '. + {pr: $pr, issue: $issue, diff: $diff}')"

          delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'json<<%s\n' "$delim"
            printf '%s\n' "$context_json"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run reviewer agent
        uses: ./.swarm-engine/actions/agent-run
        env:
          SWARM_LLM_BASE_URL: ${{ steps.config.outputs.swarm-llm-base-url }}
          SWARM_LLM_API_KEY: ${{ secrets.SWARM_LLM_API_KEY }}
        with:
          role: reviewer
          prompt-file: .swarm-engine/prompts/reviewer.md
          context-json: ${{ steps.ctx.outputs.json }}
          adapter: ${{ inputs.adapter }}
          timeout-minutes: '10'

      - name: Upload outcome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-reviewer-${{ inputs.pr }}
          path: outcome.json

      - name: Read outcome
        id: read-outcome
        run: |
          # Sanitize with tr -d '\n\r': prevents newline-injection that could
          # spoof GITHUB_OUTPUT key=value pairs (e.g. injected "approve\nverdict=approve").
          verdict="$(jq -r '.verdict' outcome.json | tr -d '\n\r')"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          summary="$(jq -r '.evidence.summary // ""' outcome.json | tr -d '\n\r')"
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          details_delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'details<<%s\n' "$details_delim"
            jq -r '.evidence | to_entries | map(select(.key != "summary")) | .[] |
              "- **\(.key):** \(if (.value | type) == "array" then (.value | map(tostring | gsub("[\\n\\r]+"; " ")) | join(", ")) else (.value | tostring | gsub("[\\n\\r]+"; " ")) end)"' \
              outcome.json
            printf '%s\n' "$details_delim"
          } >> "$GITHUB_OUTPUT"

  # ── Reviewer glue: post real PR review via SWARM_TOKEN ────────────────────
  reviewer-post:
    name: Post PR review
    runs-on: ubuntu-latest
    needs: reviewer
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.SWARM_TOKEN }}
      SWARM_SLACK_WEBHOOK: ${{ secrets.SWARM_SLACK_WEBHOOK }}
      SWARM_SLACK_BOT_TOKEN: ${{ secrets.SWARM_SLACK_BOT_TOKEN }}
      SWARM_DISCORD_WEBHOOK: ${{ secrets.SWARM_DISCORD_WEBHOOK }}
      SWARM_DISCORD_BOT_TOKEN: ${{ secrets.SWARM_DISCORD_BOT_TOKEN }}
      SWARM_TEAMS_WEBHOOK: ${{ secrets.SWARM_TEAMS_WEBHOOK }}
      SWARM_BUZZ_RELAY_URL: ${{ secrets.SWARM_BUZZ_RELAY_URL }}
      SWARM_BUZZ_PRIVATE_KEY: ${{ secrets.SWARM_BUZZ_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Validate SWARM_TOKEN present
        if: inputs.dry-run == false
        env:
          TOKEN_CHECK: ${{ secrets.SWARM_TOKEN }}
        run: |
          if [ -z "${TOKEN_CHECK:-}" ]; then
            printf 'ERROR: SWARM_TOKEN secret is absent. Provision a fine-grained PAT with pull-requests:write scope.\n' >&2
            exit 1
          fi

      - name: Check for existing review (idempotency guard)
        id: check-review
        if: inputs.dry-run == false
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          # Identify the SWARM_TOKEN actor and the current PR head SHA.
          # Skip posting if this actor already reviewed the current head commit —
          # prevents duplicate reviews when the workflow is re-run.
          actor="$(gh api /user --jq '.login')"
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${actor}\" and .commit_id == \"${head_sha}\")] | length")"
          if [ "$existing" -gt 0 ]; then
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            printf 'reviewer-post: review already posted by %s for SHA %s — skipping\n' "$actor" "$head_sha"
          else
            printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR review (approve)
        if: needs.reviewer.outputs.verdict == 'approve' && inputs.dry-run == false && steps.check-review.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ inputs.pr }}
          SUMMARY: ${{ needs.reviewer.outputs.summary }}
        run: |
          if ! gh pr review "$PR_NUMBER" \
            --approve \
            --body "$SUMMARY" \
            --repo "$GITHUB_REPOSITORY"; then
            printf 'reviewer-post: review decoration failed (self-review 422 — expected when SWARM_TOKEN authored the PR); review:approved label remains the authoritative gate\n' >&2
          fi

      - name: Apply review:approved label
        if: needs.reviewer.outputs.verdict == 'approve' && inputs.dry-run == false
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --method POST \
            -f "labels[]=review:approved"

      - name: Post PR review (request-changes)
        if: needs.reviewer.outputs.verdict == 'request-changes' && inputs.dry-run == false && steps.check-review.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ inputs.pr }}
          SUMMARY: ${{ needs.reviewer.outputs.summary }}
        run: |
          if ! gh pr review "$PR_NUMBER" \
            --request-changes \
            --body "$SUMMARY" \
            --repo "$GITHUB_REPOSITORY"; then
            printf 'reviewer-post: review decoration failed (self-review 422 — expected when SWARM_TOKEN authored the PR); review:approved label remains the authoritative gate\n' >&2
          fi

      # ── findings comment: review-signoff on PR ────────────────────────────
      - name: Post review-signoff findings comment
        if: needs.reviewer.outputs.comments-enabled != 'false' && inputs.dry-run == false
        env:
          PR_NUMBER: ${{ inputs.pr }}
          VERDICT: ${{ needs.reviewer.outputs.verdict }}
          SUMMARY: ${{ needs.reviewer.outputs.summary }}
          DETAILS: ${{ needs.reviewer.outputs.details }}
          HEADER: "**swarm reviewer**"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          HEADER="$HEADER" VERDICT="$VERDICT" SUMMARY="$SUMMARY" DETAILS="$DETAILS" \
            bash ".swarm-engine/scripts/render-comment.sh" \
              ".swarm-engine/templates/comments/review-signoff.md" \
              "$body"
          gh pr comment "$PR_NUMBER" --body-file "$body" --repo "$GITHUB_REPOSITORY"

      # ── role event: reviewer findings to notify sinks ─────────────────────
      - name: Emit reviewer role event
        if: inputs.dry-run == false
        env:
          ROLE: reviewer
          VERDICT: ${{ needs.reviewer.outputs.verdict }}
          SUMMARY: ${{ needs.reviewer.outputs.summary }}
          DETAILS: ${{ needs.reviewer.outputs.details }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          PR_NUMBER: ${{ inputs.pr }}
          ENABLED_SINKS: ${{ needs.reviewer.outputs.enabled-sinks }}
          BUZZ_CHANNEL: ${{ needs.reviewer.outputs.notify-buzz-channel }}
          SLACK_CHANNEL: ${{ needs.reviewer.outputs.notify-slack-channel }}
          DISCORD_CHANNEL: ${{ needs.reviewer.outputs.notify-discord-channel }}
          URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pr }}
        run: |
          bash ".swarm-engine/scripts/emit-role-event.sh"

      - name: Dry-run log (reviewer)
        if: inputs.dry-run == true
        env:
          PR_NUMBER: ${{ inputs.pr }}
          VERDICT: ${{ needs.reviewer.outputs.verdict }}
          SUMMARY: ${{ needs.reviewer.outputs.summary }}
        run: |
          printf 'dry-run: reviewer verdict=%s — would post PR review on PR #%s: %s\n' \
            "$VERDICT" "$PR_NUMBER" "$SUMMARY"

      - name: Unexpected reviewer verdict (fail)
        if: |
          needs.reviewer.outputs.verdict != 'approve' &&
          needs.reviewer.outputs.verdict != 'request-changes'
        env:
          VERDICT: ${{ needs.reviewer.outputs.verdict }}
        run: |
          printf 'ERROR: unexpected reviewer verdict: %s\n' "$VERDICT" >&2
          exit 1

  # ── Security agent (parallel with reviewer) ───────────────────────────────
  security:
    name: Security agent
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.read-outcome.outputs.verdict }}
      summary: ${{ steps.read-outcome.outputs.summary }}
      details: ${{ steps.read-outcome.outputs.details }}
      comments-enabled: ${{ steps.config.outputs.comments-enabled }}
      enabled-sinks: ${{ steps.config.outputs.enabled-sinks }}
      notify-buzz-channel: ${{ steps.config.outputs.notify-buzz-channel }}
      notify-slack-channel: ${{ steps.config.outputs.notify-slack-channel }}
      notify-discord-channel: ${{ steps.config.outputs.notify-discord-channel }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_LLM_MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      - name: Fetch PR diff and metadata
        id: ctx
        env:
          PR_NUMBER: ${{ inputs.pr }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          pr_meta="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{title: .title, body: .body, head_sha: .head.sha}')"

          pr_diff="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --header "Accept: application/vnd.github.v3.diff")"

          context_json="$(printf '%s' "$pr_meta" | jq \
            --argjson pr "$PR_NUMBER" \
            --argjson issue "$ISSUE_NUMBER" \
            --arg diff "$pr_diff" \
            '. + {pr: $pr, issue: $issue, diff: $diff}')"

          delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'json<<%s\n' "$delim"
            printf '%s\n' "$context_json"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run security agent
        uses: ./.swarm-engine/actions/agent-run
        env:
          SWARM_LLM_BASE_URL: ${{ steps.config.outputs.swarm-llm-base-url }}
          SWARM_LLM_API_KEY: ${{ secrets.SWARM_LLM_API_KEY }}
        with:
          role: security
          prompt-file: .swarm-engine/prompts/security.md
          context-json: ${{ steps.ctx.outputs.json }}
          adapter: ${{ inputs.adapter }}
          timeout-minutes: '10'

      - name: Upload outcome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-security-${{ inputs.pr }}
          path: outcome.json

      - name: Read outcome
        id: read-outcome
        run: |
          # Sanitize with tr -d '\n\r': prevents newline-injection that could
          # spoof GITHUB_OUTPUT key=value pairs (same defense as reviewer job).
          verdict="$(jq -r '.verdict' outcome.json | tr -d '\n\r')"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          summary="$(jq -r '.evidence.summary // ""' outcome.json | tr -d '\n\r')"
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          details_delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'details<<%s\n' "$details_delim"
            jq -r '.evidence | to_entries | map(select(.key != "summary")) | .[] |
              "- **\(.key):** \(if (.value | type) == "array" then (.value | map(tostring | gsub("[\\n\\r]+"; " ")) | join(", ")) else (.value | tostring | gsub("[\\n\\r]+"; " ")) end)"' \
              outcome.json
            printf '%s\n' "$details_delim"
          } >> "$GITHUB_OUTPUT"

  # ── Merge gate: human approval (swarm-approval environment) + squash-merge ──
  #
  # This is the terminal job. It runs after reviewer-post and security-post have
  # both completed successfully. GitHub pauses the job here to request a human
  # "Review deployments" approval in the Actions UI (the swarm-approval
  # environment gate). After the human clicks Approve, the job resumes:
  #   1. Pre-merge verification: review:approved label present, no
  #      swarm:needs-human on the issue, all completed check-runs green.
  #   2. gh pr merge --squash --delete-branch via SWARM_TOKEN so that the
  #      resulting pull_request:closed event is authored by a distinct actor
  #      and fires the docs.yml cascade (GITHUB_TOKEN merges do NOT trigger it).
  #   3. Transition the issue swarm:qa → swarm:docs.
  merge:
    name: Merge (swarm-approval gate)
    runs-on: ubuntu-latest
    needs: [reviewer-post, security-post]
    timeout-minutes: 10
    environment: swarm-approval
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_SLACK_WEBHOOK: ${{ secrets.SWARM_SLACK_WEBHOOK }}
      SWARM_SLACK_BOT_TOKEN: ${{ secrets.SWARM_SLACK_BOT_TOKEN }}
      SWARM_DISCORD_WEBHOOK: ${{ secrets.SWARM_DISCORD_WEBHOOK }}
      SWARM_DISCORD_BOT_TOKEN: ${{ secrets.SWARM_DISCORD_BOT_TOKEN }}
      SWARM_TEAMS_WEBHOOK: ${{ secrets.SWARM_TEAMS_WEBHOOK }}
      SWARM_BUZZ_RELAY_URL: ${{ secrets.SWARM_BUZZ_RELAY_URL }}
      SWARM_BUZZ_PRIVATE_KEY: ${{ secrets.SWARM_BUZZ_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      - name: Validate SWARM_TOKEN present
        if: inputs.dry-run == false
        env:
          TOKEN_CHECK: ${{ secrets.SWARM_TOKEN }}
        run: |
          if [ -z "${TOKEN_CHECK:-}" ]; then
            printf 'WARNING: SWARM_TOKEN absent — merge will fall back to GITHUB_TOKEN. A PAT-authored merge is required for the docs.yml pull_request:closed cascade; GITHUB_TOKEN merges are suppressed by GitHub recursion guard.\n' >&2
          fi

      - name: Pre-merge verification
        if: inputs.dry-run == false
        id: verify
        env:
          PR_NUMBER: ${{ inputs.pr }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          # 1. Confirm review:approved label is present on the PR.
          pr_labels="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --jq '[.[].name]')"
          if ! printf '%s' "$pr_labels" | jq -e 'map(select(. == "review:approved")) | length > 0' > /dev/null; then
            printf 'ERROR: pre-merge verification failed — review:approved label absent on PR #%s\n' "${PR_NUMBER}" >&2
            exit 1
          fi

          # 2. Confirm swarm:needs-human is NOT present on the issue.
          issue_labels="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --jq '[.[].name]')"
          if printf '%s' "$issue_labels" | jq -e 'map(select(. == "swarm:needs-human")) | length > 0' > /dev/null; then
            printf 'ERROR: pre-merge verification failed — swarm:needs-human is present on issue #%s; resolve escalation before merging\n' "${ISSUE_NUMBER}" >&2
            exit 1
          fi

          # 3. Verify all COMPLETED check-runs on the head SHA are success or skipped.
          # Runs that are still in_progress or queued are excluded (the swarm run itself
          # is still running at this point). Any completed run with a non-green conclusion
          # blocks the merge.
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.head.sha')"
          check_runs="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
            --jq '.check_runs')"

          failing="$(printf '%s' "$check_runs" | jq '[
            .[] |
            select(.status == "completed") |
            select(.conclusion != "success" and .conclusion != "skipped")
          ] | length')"

          if [ "${failing}" -gt 0 ]; then
            printf 'ERROR: pre-merge verification failed — %s completed check-run(s) are not success/skipped on SHA %s:\n' \
              "${failing}" "${head_sha}" >&2
            printf '%s' "$check_runs" | jq '[
              .[] |
              select(.status == "completed") |
              select(.conclusion != "success" and .conclusion != "skipped") |
              {name: .name, status: .status, conclusion: .conclusion}
            ]' >&2
            exit 1
          fi

          printf 'pre-merge verification: review:approved present, no swarm:needs-human, all completed checks green on %s\n' "${head_sha}"

      - name: Dry-run log (pre-merge verification)
        if: inputs.dry-run == true
        env:
          PR_NUMBER: ${{ inputs.pr }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: pre-merge verification — would check review:approved label on PR #%s, no swarm:needs-human on issue #%s, and all completed check-runs green\n' \
            "${PR_NUMBER}" "${ISSUE_NUMBER}"

      - name: Squash-merge PR via SWARM_TOKEN
        if: inputs.dry-run == false
        env:
          PR_NUMBER: ${{ inputs.pr }}
          SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
        run: |
          if [ -n "${SWARM_TOKEN:-}" ]; then
            GH_TOKEN="${SWARM_TOKEN}" gh pr merge "${PR_NUMBER}" \
              --squash \
              --delete-branch \
              --repo "${GITHUB_REPOSITORY}"
            printf 'merge: squash-merged PR #%s via SWARM_TOKEN\n' "${PR_NUMBER}"
          else
            printf 'WARNING: SWARM_TOKEN absent — merging with GITHUB_TOKEN; docs.yml cascade will NOT fire (GitHub recursion guard)\n' >&2
            gh pr merge "${PR_NUMBER}" \
              --squash \
              --delete-branch \
              --repo "${GITHUB_REPOSITORY}"
            printf 'merge: squash-merged PR #%s via GITHUB_TOKEN (degraded mode)\n' "${PR_NUMBER}"
          fi

      - name: Dry-run log (merge)
        if: inputs.dry-run == true
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          printf 'dry-run: merge — would squash-merge and delete branch for PR #%s via SWARM_TOKEN\n' "${PR_NUMBER}"

      # ── role event: merged lifecycle to notify sinks ───────────────────────
      - name: Emit merged lifecycle role event
        if: inputs.dry-run == false
        env:
          ROLE: orchestrator
          VERDICT: merged
          SUMMARY: PR #${{ inputs.pr }} merged; all pipeline stages passed.
          DETAILS: |-
            - reviewer: approved
            - security: passed
            - merge: squash-merged
          ISSUE_NUMBER: ${{ inputs.issue }}
          PR_NUMBER: ${{ inputs.pr }}
          ENABLED_SINKS: ${{ steps.config.outputs.enabled-sinks }}
          BUZZ_CHANNEL: ${{ steps.config.outputs.notify-buzz-channel }}
          SLACK_CHANNEL: ${{ steps.config.outputs.notify-slack-channel }}
          DISCORD_CHANNEL: ${{ steps.config.outputs.notify-discord-channel }}
          URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pr }}
        run: |
          bash ".swarm-engine/scripts/emit-role-event.sh"

      - name: Transition swarm:qa → swarm:docs
        if: inputs.dry-run == false
        uses: ./.swarm-engine/actions/transition
        with:
          issue-number: ${{ inputs.issue }}
          from-stage: swarm:qa
          to-stage: swarm:docs
          token: ${{ secrets.SWARM_TOKEN }}
          enabled-sinks: ${{ steps.config.outputs.enabled-sinks }}
          buzz-channel: ${{ steps.config.outputs.notify-buzz-channel }}
          slack-channel: ${{ steps.config.outputs.notify-slack-channel }}
          discord-channel: ${{ steps.config.outputs.notify-discord-channel }}

      - name: Dry-run log (transition)
        if: inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: transition — would move issue #%s from swarm:qa to swarm:docs\n' "${ISSUE_NUMBER}"

  # ── Security glue: comment on advisory/fail; exit non-zero on fail ────────
  security-post:
    name: Post security verdict
    runs-on: ubuntu-latest
    needs: security
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_SLACK_WEBHOOK: ${{ secrets.SWARM_SLACK_WEBHOOK }}
      SWARM_SLACK_BOT_TOKEN: ${{ secrets.SWARM_SLACK_BOT_TOKEN }}
      SWARM_DISCORD_WEBHOOK: ${{ secrets.SWARM_DISCORD_WEBHOOK }}
      SWARM_DISCORD_BOT_TOKEN: ${{ secrets.SWARM_DISCORD_BOT_TOKEN }}
      SWARM_TEAMS_WEBHOOK: ${{ secrets.SWARM_TEAMS_WEBHOOK }}
      SWARM_BUZZ_RELAY_URL: ${{ secrets.SWARM_BUZZ_RELAY_URL }}
      SWARM_BUZZ_PRIVATE_KEY: ${{ secrets.SWARM_BUZZ_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      # ── findings comment: security-signoff on PR ───────────────────────────
      - name: Post security-signoff findings comment
        if: needs.security.outputs.comments-enabled != 'false' && inputs.dry-run == false
        env:
          PR_NUMBER: ${{ inputs.pr }}
          VERDICT: ${{ needs.security.outputs.verdict }}
          SUMMARY: ${{ needs.security.outputs.summary }}
          DETAILS: ${{ needs.security.outputs.details }}
          HEADER: "**swarm security**"
        run: |
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          HEADER="$HEADER" VERDICT="$VERDICT" SUMMARY="$SUMMARY" DETAILS="$DETAILS" \
            bash ".swarm-engine/scripts/render-comment.sh" \
              ".swarm-engine/templates/comments/security-signoff.md" \
              "$body"
          gh pr comment "$PR_NUMBER" --body-file "$body" --repo "$GITHUB_REPOSITORY"

      # ── when security fails: also post blocked comment on issue ───────────
      - name: Post security-blocked comment on issue
        if: needs.security.outputs.verdict == 'fail' && needs.security.outputs.comments-enabled != 'false' && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
          SUMMARY: ${{ needs.security.outputs.summary }}
          HEADER: "**swarm security**"
          VERDICT: "fail"
          DETAILS: ${{ needs.security.outputs.details }}
        run: |
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          HEADER="$HEADER" VERDICT="$VERDICT" SUMMARY="$SUMMARY" DETAILS="$DETAILS" \
            bash ".swarm-engine/scripts/render-comment.sh" \
              ".swarm-engine/templates/comments/blocked.md" \
              "$body"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body" --repo "$GITHUB_REPOSITORY"

      # ── role event: security findings to notify sinks ─────────────────────
      - name: Emit security role event
        if: inputs.dry-run == false
        env:
          ROLE: security
          VERDICT: ${{ needs.security.outputs.verdict }}
          SUMMARY: ${{ needs.security.outputs.summary }}
          DETAILS: ${{ needs.security.outputs.details }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          PR_NUMBER: ${{ inputs.pr }}
          ENABLED_SINKS: ${{ needs.security.outputs.enabled-sinks }}
          BUZZ_CHANNEL: ${{ needs.security.outputs.notify-buzz-channel }}
          SLACK_CHANNEL: ${{ needs.security.outputs.notify-slack-channel }}
          DISCORD_CHANNEL: ${{ needs.security.outputs.notify-discord-channel }}
          URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pr }}
        run: |
          bash ".swarm-engine/scripts/emit-role-event.sh"

      - name: Post fail and exit non-zero
        if: needs.security.outputs.verdict == 'fail' && inputs.dry-run == false
        run: |
          exit 1

      - name: Dry-run log (security)
        if: inputs.dry-run == true
        env:
          PR_NUMBER: ${{ inputs.pr }}
          VERDICT: ${{ needs.security.outputs.verdict }}
          SUMMARY: ${{ needs.security.outputs.summary }}
        run: |
          printf 'dry-run: security verdict=%s — would handle PR #%s: %s\n' \
            "$VERDICT" "$PR_NUMBER" "$SUMMARY"

      - name: Unexpected security verdict (fail)
        if: |
          needs.security.outputs.verdict != 'pass' &&
          needs.security.outputs.verdict != 'advisory' &&
          needs.security.outputs.verdict != 'fail'
        env:
          VERDICT: ${{ needs.security.outputs.verdict }}
        run: |
          printf 'ERROR: unexpected security verdict: %s\n' "$VERDICT" >&2
          exit 1
