# develop.yml — swarm develop reusable workflow (workflow_call)
#
# Caller-input surface:
#   issue          (number,  required)                  Issue number to implement.
#   base-branch    (string,  default: main)             Integration branch for the PR.
#   runner-label   (string,  default: swarm-agent)      Runner label for the develop job. All jobs run on this label.
#   dry-run        (boolean, default: false)             When true, logs all intended mutations without executing any writes.
#   adapter        (string,  default: claude-code-action) Develop adapter. One of: claude-code-action, headless.
#   adapter-cmd    (string,  default: "")               CLI command for the headless adapter (e.g. "claude -p", "aider --yes-always").
#                                                        Required when adapter=headless; ignored otherwise.
#   model          (string,  default: "")               LLM model identifier recorded in PR body. Forwarded to headless adapter as
#                                                        SWARM_LLM_MODEL; passed as CLAUDE_MODEL env for claude-code-action.
#   maintainer     (string,  default: "")               GitHub username to assign when bump-attempts escalates.
#   engine-repo    (string,  default: benmarte/swarm)   Engine repository (org/repo). Override for forks.
#   engine-ref     (string,  default: v1)               Engine ref (tag, branch, or SHA) checked out into .swarm-engine/.
#                                                        Must match the ref used in `uses: <repo>/.github/workflows/...@<ref>`.
#   enabled-sinks  (string,  default: "")               Comma-separated notify sinks (slack,buzz,discord,teams). Derived from load-config.
#   buzz-channel   (string,  default: "")               Buzz/Nostr channel UUID. Derived from load-config.
#
# Behavior per SPEC §2.2 / §2.3 / §8:
#   engine-owns-everything for BOTH adapters:
#     - headless:           engine manages git identity, branch swarm/issue-N, spec file,
#                           adapter invocation, commit, push, gh pr create, PR verify, transition.
#     - claude-code-action: the SHA-pinned action runs as a conditional step (file-edit mode,
#                           no auto-PR); engine always runs after to verify PR + transition.
#
#   docs/specs/issue-N.md is committed on the feature branch (SPEC §8.1).
#
# Idempotency: concurrency group swarm-<issue> with cancel-in-progress: false deduplicates
# concurrent runs triggered by the same issue label without cancelling an in-flight run.
#
# Permissions per job:
#   develop job: contents: write, pull-requests: write, issues: write
#     write needed for: git push, gh pr create, label transitions, bump-attempts

on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to implement.
        required: true
        type: number
      base-branch:
        description: Integration branch for the PR.
        required: false
        type: string
        default: main
      runner-label:
        description: Runner label for the develop job.
        required: false
        type: string
        default: swarm-agent
      dry-run:
        description: When true, log intended mutations without executing them.
        required: false
        type: boolean
        default: false
      adapter:
        description: Develop adapter (claude-code-action or headless).
        required: false
        type: string
        default: claude-code-action
      adapter-cmd:
        description: >
          CLI command for the headless adapter (e.g. "claude -p", "aider --yes-always").
          Required when adapter=headless; ignored for claude-code-action.
        required: false
        type: string
        default: ""
      model:
        description: LLM model identifier recorded in PR body and forwarded to the adapter.
        required: false
        type: string
        default: ""
      maintainer:
        description: GitHub username to assign when bump-attempts escalates to swarm:needs-human.
        required: false
        type: string
        default: ""
      enabled-sinks:
        description: Comma-separated notify sinks (slack,buzz,discord,teams). Derived from load-config; forwarded to develop-run for transition/bump-attempts notify fan-out.
        required: false
        type: string
        default: ""
      buzz-channel:
        description: Buzz/Nostr channel UUID. Derived from load-config; forwarded to develop-run for transition/bump-attempts notify fan-out.
        required: false
        type: string
        default: ""
      engine-repo:
        description: Engine repository (org/repo). Override for forks.
        required: false
        type: string
        default: benmarte/swarm
      engine-ref:
        description: Engine ref (tag, branch, or SHA) to check out into .swarm-engine/. Must match the ref pinned in the caller uses directive.
        required: false
        type: string
        default: v1
    secrets:
      SWARM_TOKEN:
        description: >
          Fine-grained PAT with issues:write scope for a distinct actor.
          Forwarded to develop-run which passes it to transition.sh and
          bump-attempts.sh so that label writes trigger cascade workflows.
          When absent those scripts fall back to GITHUB_TOKEN with a warning.
        required: false
      ANTHROPIC_API_KEY:
        description: >
          Anthropic API key for the claude-code-action adapter.
          Required when adapter=claude-code-action and using API-key auth.
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >
          Claude Code OAuth token for the claude-code-action adapter.
          Alternative to ANTHROPIC_API_KEY for Max/Pro subscription auth.
        required: false
      SWARM_SLACK_WEBHOOK:
        description: Slack incoming webhook URL for notify fan-out. Required when slack is in enabled-sinks.
        required: false
      SWARM_DISCORD_WEBHOOK:
        description: Discord webhook URL for notify fan-out. Required when discord is in enabled-sinks.
        required: false
      SWARM_TEAMS_WEBHOOK:
        description: Microsoft Teams webhook URL for notify fan-out. Required when teams is in enabled-sinks.
        required: false
      SWARM_BUZZ_RELAY_URL:
        description: Buzz/Nostr relay wss:// URL for notify fan-out. Required when buzz is in enabled-sinks.
        required: false
      SWARM_BUZZ_PRIVATE_KEY:
        description: Nostr private key (hex or nsec) for the buzz adapter. Required when buzz is in enabled-sinks.
        required: false

concurrency:
  group: swarm-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  develop:
    name: Implement issue
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_LLM_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Fetch issue + spec context
        id: ctx
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          issue_json="$(gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,labels,comments \
            --repo "$GITHUB_REPOSITORY")"

          # Extract spec from the most recent issue comment that looks like a PM spec
          # (first comment body containing the swarm spec marker or longest comment)
          spec_body="$(printf '%s' "$issue_json" | jq -r '
            .comments
            | sort_by(.createdAt)
            | reverse
            | map(select(.body | test("## Acceptance Criteria|## Spec|swarm/outcome@1"; "i")))
            | first // ""
            | .body // ""
          ')"

          # Fallback: use the issue body if no spec comment found
          if [ -z "$spec_body" ]; then
            spec_body="$(printf '%s' "$issue_json" | jq -r '.body // ""')"
          fi

          issue_title="$(printf '%s' "$issue_json" | jq -r '.title // ""')"

          # Build develop prompt for claude-code-action (single-line printf to stay inside YAML block scalar)
          tmp_prompt="$(mktemp)"
          {
            printf 'You are a coding agent implementing GitHub issue #%s.\n\n' "$ISSUE_NUMBER"
            printf 'Edit files in the working directory to satisfy the specification below.\n'
            printf 'The engine will commit your changes, push, and open the PR.\n\n'
            printf '## Issue: %s\n\n' "$issue_title"
            printf '## Specification\n\n'
            printf '%s\n' "$spec_body"
          } > "$tmp_prompt"
          develop_prompt="$(cat "$tmp_prompt")"
          rm -f "$tmp_prompt"

          # Write outputs with random delimiters to avoid injection
          spec_delim="develop_$(openssl rand -hex 16)"
          {
            printf 'spec-body<<%s\n' "$spec_delim"
            printf '%s\n' "$spec_body"
            printf '%s\n' "$spec_delim"
          } >> "$GITHUB_OUTPUT"

          prompt_delim="develop_$(openssl rand -hex 16)"
          {
            printf 'develop-prompt<<%s\n' "$prompt_delim"
            printf '%s\n' "$develop_prompt"
            printf '%s\n' "$prompt_delim"
          } >> "$GITHUB_OUTPUT"

      # ── claude-code-action adapter (conditional) ───────────────────────────
      # Runs BEFORE the engine. Edits the working tree in file-edit mode.
      # create_pull_request=false — engine creates the PR for a uniform body.
      # SHA-pinned to v1.0.183 (commit: be7b93b1907a4abad570368f3c74b6fe3807510b)
      # To upgrade: see actions/develop-run/adapters/claude-code-action/README.md
      - name: Run claude-code-action adapter
        if: inputs.adapter == 'claude-code-action' && inputs.dry-run == false
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          prompt: ${{ steps.ctx.outputs.develop-prompt }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_name: swarm/issue-${{ inputs.issue }}
          base_branch: ${{ inputs.base-branch }}
          create_pull_request: "false"
        env:
          CLAUDE_MODEL: ${{ inputs.model }}

      # ── develop engine (always runs, both adapters) ────────────────────────
      # For headless:            engine does git config, branch, spec write,
      #                          adapter invocation, commit, push, PR create,
      #                          PR verify.  Transition is handled by the notify
      #                          job below so sink secrets never share a job with
      #                          the LLM adapter (security: issue #40 class).
      # For claude-code-action:  action edits working tree (file-edit mode,
      #                          create_pull_request=false); engine then runs
      #                          the same commit/push/PR-create/verify path as
      #                          headless — engine-owns-everything.
      - name: Run develop engine
        uses: ./.swarm-engine/actions/develop-run
        with:
          issue-number: ${{ inputs.issue }}
          base-branch: ${{ inputs.base-branch }}
          adapter: ${{ inputs.adapter }}
          spec-body: ${{ steps.ctx.outputs.spec-body }}
          dry-run: ${{ inputs.dry-run }}
          adapter-cmd: ${{ inputs.adapter-cmd }}
          model: ${{ inputs.model }}
          maintainer: ${{ inputs.maintainer }}
          token: ${{ secrets.SWARM_TOKEN }}

  # ── Notify: transition + sink fan-out (separate job — no LLM adapter) ───────
  # Sink secrets are scoped to this job only so the LLM adapter steps above
  # cannot read SWARM_BUZZ_PRIVATE_KEY or the webhook URLs (issue #40 class).
  # Only runs when the develop job succeeds (PR created and verified).
  notify:
    name: Transition and notify
    needs: develop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_SLACK_WEBHOOK: ${{ secrets.SWARM_SLACK_WEBHOOK }}
      SWARM_DISCORD_WEBHOOK: ${{ secrets.SWARM_DISCORD_WEBHOOK }}
      SWARM_TEAMS_WEBHOOK: ${{ secrets.SWARM_TEAMS_WEBHOOK }}
      SWARM_BUZZ_RELAY_URL: ${{ secrets.SWARM_BUZZ_RELAY_URL }}
      SWARM_BUZZ_PRIVATE_KEY: ${{ secrets.SWARM_BUZZ_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      # ── findings comment: pr-opened on issue ─────────────────────────────
      - name: Find PR for issue (comment)
        id: find-pr
        if: steps.config.outputs.comments-enabled != 'false' && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "swarm/issue-${ISSUE_NUMBER}" --state all \
            --json url --jq '.[0].url // ""')"
          pr_title_delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'pr-url<<%s\n' "$pr_title_delim"
            gh pr list --repo "$GITHUB_REPOSITORY" \
              --head "swarm/issue-${ISSUE_NUMBER}" --state all \
              --json title --jq '.[0].title // ""'
            printf '%s\n' "$pr_title_delim"
          } >> "$GITHUB_OUTPUT"
          pr_url_delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'pr-link<<%s\n' "$pr_url_delim"
            printf '%s\n' "$pr_url"
            printf '%s\n' "$pr_url_delim"
          } >> "$GITHUB_OUTPUT"

      - name: Post pr-opened findings comment
        if: steps.config.outputs.comments-enabled != 'false' && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
          PR: ${{ steps.find-pr.outputs.pr-link }}
          SUMMARY: ${{ steps.find-pr.outputs.pr-url }}
          HEADER: "**swarm developer**"
          DETAILS: ""
        run: |
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          HEADER="$HEADER" PR="$PR" SUMMARY="$SUMMARY" DETAILS="$DETAILS" \
            bash ".swarm-engine/scripts/render-comment.sh" \
              ".swarm-engine/templates/comments/pr-opened.md" \
              "$body"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body" --repo "$GITHUB_REPOSITORY"

      - name: Dry-run log (pr-opened comment)
        if: steps.config.outputs.comments-enabled != 'false' && inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: would post pr-opened findings comment on issue #%s\n' "$ISSUE_NUMBER"

      - name: Transition swarm:develop → swarm:qa
        if: inputs.dry-run == false
        uses: ./.swarm-engine/actions/transition
        with:
          issue-number: ${{ inputs.issue }}
          from-stage: swarm:develop
          to-stage: swarm:qa
          token: ${{ secrets.SWARM_TOKEN }}
          enabled-sinks: ${{ steps.config.outputs.enabled-sinks }}
          buzz-channel: ${{ steps.config.outputs.notify-buzz-channel }}

      - name: Dry-run log (transition)
        if: inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: would transition issue #%s from swarm:develop to swarm:qa\n' "$ISSUE_NUMBER"
