# intake.yml — swarm intake reusable workflow (workflow_call)
#
# Caller-input surface:
#   issue          (number,  required)                 Issue number to validate.
#   runner-label   (string,  default: swarm-agent)     Runner label for the agent job. Glue jobs always use ubuntu-latest.
#   dry-run        (boolean, default: false)            When true, logs all intended mutations without executing any GitHub API writes.
#   adapter        (string,  default: claude)           Agent adapter forwarded to agent-run. One of: claude, openai-compat.
#   model          (string,  default: "")               LLM model identifier set as SWARM_LLM_MODEL env on the agent job.
#                                                       Consumed by the openai-compat adapter (SWARM_LLM_MODEL); ignored by claude.
#   engine-repo    (string,  default: benmarte/swarm)  Engine repository (org/repo). Override for forks.
#   engine-ref     (string,  default: v1)              Engine ref (tag, branch, or SHA) checked out into .swarm-engine/.
#                                                       Must match the ref used in `uses: <repo>/.github/workflows/...@<ref>`.
#   enabled-sinks  (string,  default: "")               Comma-separated notify sinks (slack,buzz,discord,teams).
#                                                       Derived from load-config; passed through to transition notify fan-out.
#   buzz-channel   (string,  default: "")               Buzz/Nostr channel UUID. Passed through to transition notify fan-out.
#
# Routing per SPEC §2.1:
#   verdict=confirmed  → actions/transition swarm:go → swarm:spec
#   verdict=duplicate  → gh issue comment (duplicate explanation) + gh issue close
#   verdict=invalid    → gh issue comment (invalid explanation)   + gh issue close
#   verdict=needs-info → gh issue comment (clarification request) + actions/transition swarm:go → swarm:needs-human
#
# Idempotency: concurrency group swarm-<issue> with cancel-in-progress: false prevents duplicate
# runs for the same issue without cancelling an already-running validation.
#
# Permissions per job:
#   agent job : contents: read, issues: read  (action_path resolution + gh issue view)
#   route job : contents: read, issues: write (label swaps, comments, close)

on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to validate.
        required: true
        type: number
      runner-label:
        description: Runner label for the agent job. Glue jobs always use ubuntu-latest.
        required: false
        type: string
        default: swarm-agent
      dry-run:
        description: When true, log intended mutations without executing them.
        required: false
        type: boolean
        default: false
      adapter:
        description: Agent adapter (claude or openai-compat).
        required: false
        type: string
        default: claude
      model:
        description: LLM model identifier set as SWARM_LLM_MODEL. Consumed by openai-compat; ignored by claude.
        required: false
        type: string
        default: ""
      enabled-sinks:
        description: Comma-separated notify sinks (slack,buzz,discord,teams). Derived from load-config; passed to transition notify fan-out.
        required: false
        type: string
        default: ""
      buzz-channel:
        description: Buzz/Nostr channel UUID. Passed to transition notify fan-out.
        required: false
        type: string
        default: ""
      engine-repo:
        description: Engine repository (org/repo). Override for forks.
        required: false
        type: string
        default: benmarte/swarm
      engine-ref:
        description: Engine ref (tag, branch, or SHA) to check out into .swarm-engine/. Must match the ref pinned in the caller uses directive.
        required: false
        type: string
        default: v1
    secrets:
      SWARM_TOKEN:
        description: >
          Fine-grained PAT with issues:write scope for a distinct actor.
          Required for stage-label cascades — GITHUB_TOKEN-written labels do not
          trigger workflow runs (GitHub recursion guard). When absent the
          transition action falls back to GITHUB_TOKEN with a loud warning.
        required: false
      SWARM_LLM_API_KEY:
        description: >
          Bearer token for the OpenAI-compatible LLM endpoint.
          Optional — omit for local endpoints that need no authentication.
        required: false
      SWARM_SLACK_WEBHOOK:
        description: Slack incoming webhook URL for notify fan-out. Required when slack is in enabled-sinks.
        required: false
      SWARM_DISCORD_WEBHOOK:
        description: Discord webhook URL for notify fan-out. Required when discord is in enabled-sinks.
        required: false
      SWARM_TEAMS_WEBHOOK:
        description: Microsoft Teams webhook URL for notify fan-out. Required when teams is in enabled-sinks.
        required: false
      SWARM_BUZZ_RELAY_URL:
        description: Buzz/Nostr relay wss:// URL for notify fan-out. Required when buzz is in enabled-sinks.
        required: false
      SWARM_BUZZ_PRIVATE_KEY:
        description: Nostr private key (hex or nsec) for the buzz adapter. Required when buzz is in enabled-sinks.
        required: false

concurrency:
  group: swarm-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  agent:
    name: Validate issue
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      verdict: ${{ steps.read-outcome.outputs.verdict }}
      runner-label: ${{ steps.config.outputs.runner-label }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_LLM_MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      - name: Fetch issue context
        id: ctx
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          context_json="$(gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,labels \
            --repo "$GITHUB_REPOSITORY")"
          delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'json<<%s\n' "$delim"
            printf '%s\n' "$context_json"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run validator agent
        uses: ./.swarm-engine/actions/agent-run
        env:
          SWARM_LLM_BASE_URL: ${{ steps.config.outputs.swarm-llm-base-url }}
          SWARM_LLM_API_KEY: ${{ secrets.SWARM_LLM_API_KEY }}
        with:
          role: validator
          prompt-file: .swarm-engine/prompts/validator.md
          context-json: ${{ steps.ctx.outputs.json }}
          adapter: ${{ inputs.adapter }}
          timeout-minutes: '10'

      - name: Upload outcome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-${{ inputs.issue }}
          path: outcome.json

      - name: Read outcome verdict
        id: read-outcome
        run: |
          verdict="$(jq -r '.verdict' outcome.json)"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"

  route:
    name: Route verdict
    runs-on: ubuntu-latest
    needs: agent
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_SLACK_WEBHOOK: ${{ secrets.SWARM_SLACK_WEBHOOK }}
      SWARM_DISCORD_WEBHOOK: ${{ secrets.SWARM_DISCORD_WEBHOOK }}
      SWARM_TEAMS_WEBHOOK: ${{ secrets.SWARM_TEAMS_WEBHOOK }}
      SWARM_BUZZ_RELAY_URL: ${{ secrets.SWARM_BUZZ_RELAY_URL }}
      SWARM_BUZZ_PRIVATE_KEY: ${{ secrets.SWARM_BUZZ_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      # ── confirmed: advance to swarm:spec ──────────────────────────────────
      - name: Transition confirmed → swarm:spec
        if: needs.agent.outputs.verdict == 'confirmed' && inputs.dry-run == false
        uses: ./.swarm-engine/actions/transition
        with:
          issue-number: ${{ inputs.issue }}
          from-stage: swarm:go
          to-stage: swarm:spec
          token: ${{ secrets.SWARM_TOKEN }}
          enabled-sinks: ${{ steps.config.outputs.enabled-sinks }}
          buzz-channel: ${{ steps.config.outputs.notify-buzz-channel }}

      - name: Dry-run log (confirmed)
        if: needs.agent.outputs.verdict == 'confirmed' && inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: verdict=confirmed — would transition issue #%s from swarm:go to swarm:spec\n' "$ISSUE_NUMBER"

      # ── duplicate / invalid: comment + close ──────────────────────────────
      - name: Comment and close (duplicate/invalid)
        if: (needs.agent.outputs.verdict == 'duplicate' || needs.agent.outputs.verdict == 'invalid') && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
          VERDICT: ${{ needs.agent.outputs.verdict }}
        run: |
          case "$VERDICT" in
            duplicate)
              msg="The validator has identified this issue as a duplicate of an existing issue. Closing."
              ;;
            invalid)
              msg="The validator has identified this issue as invalid or out of scope. Closing."
              ;;
            *)
              msg="Issue closed by swarm validator."
              ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --body "$msg" --repo "$GITHUB_REPOSITORY"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Dry-run log (duplicate/invalid)
        if: (needs.agent.outputs.verdict == 'duplicate' || needs.agent.outputs.verdict == 'invalid') && inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
          VERDICT: ${{ needs.agent.outputs.verdict }}
        run: |
          printf 'dry-run: verdict=%s — would comment and close issue #%s\n' "$VERDICT" "$ISSUE_NUMBER"

      # ── needs-info: clarification comment + transition to needs-human ──────
      - name: Comment needs-info
        if: needs.agent.outputs.verdict == 'needs-info' && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "The validator requires additional information before this issue can proceed. Please provide the requested details; a maintainer will then re-apply \`swarm:go\`." \
            --repo "$GITHUB_REPOSITORY"

      - name: Transition needs-info → swarm:needs-human
        if: needs.agent.outputs.verdict == 'needs-info' && inputs.dry-run == false
        uses: ./.swarm-engine/actions/transition
        with:
          issue-number: ${{ inputs.issue }}
          from-stage: swarm:go
          to-stage: swarm:needs-human
          token: ${{ secrets.SWARM_TOKEN }}
          enabled-sinks: ${{ steps.config.outputs.enabled-sinks }}
          buzz-channel: ${{ steps.config.outputs.notify-buzz-channel }}

      - name: Dry-run log (needs-info)
        if: needs.agent.outputs.verdict == 'needs-info' && inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: verdict=needs-info — would comment and transition issue #%s from swarm:go to swarm:needs-human\n' "$ISSUE_NUMBER"

      # ── unexpected verdict: fail loudly ───────────────────────────────────
      - name: Unexpected verdict (fail)
        if: |
          needs.agent.outputs.verdict != 'confirmed' &&
          needs.agent.outputs.verdict != 'duplicate' &&
          needs.agent.outputs.verdict != 'invalid' &&
          needs.agent.outputs.verdict != 'needs-info'
        env:
          VERDICT: ${{ needs.agent.outputs.verdict }}
        run: |
          printf 'ERROR: unexpected validator verdict: %s\n' "$VERDICT" >&2
          exit 1
