# spec.yml — swarm spec reusable workflow (workflow_call)
#
# Caller-input surface:
#   issue          (number,  required)                 Issue number to spec.
#   runner-label   (string,  default: swarm-agent)     Runner label for the agent job. Glue jobs always use ubuntu-latest.
#   dry-run        (boolean, default: false)            When true, logs all intended mutations without executing any GitHub API writes.
#   adapter        (string,  default: claude)           Agent adapter forwarded to agent-run. One of: claude, openai-compat.
#   model          (string,  default: "")               LLM model identifier set as SWARM_LLM_MODEL env on the agent job.
#                                                       Consumed by the openai-compat adapter; ignored by claude.
#   engine-repo    (string,  default: benmarte/swarm)  Engine repository (org/repo). Override for forks.
#   engine-ref     (string,  default: v1)              Engine ref (tag, branch, or SHA) checked out into .swarm-engine/.
#                                                       Must match the ref used in `uses: <repo>/.github/workflows/...@<ref>`.
#   enabled-sinks  (string,  default: "")               Reserved: comma-separated notify sinks (slack,buzz,discord,teams).
#                                                       Will be wired to transition/notify when those actions expose the input.
#   buzz-channel   (string,  default: "")               Reserved: Buzz/Nostr channel UUID. Will be wired to notify passthrough.
#
# Behavior per SPEC §2.2 + §8 explicit decision:
#   1. PM agent runs via agent-run (role: pm, prompt-file: prompts/pm.md).
#   2. outcome.json uploaded as artifact outcome-<issue>.
#   3. Glue job posts evidence.spec_body from outcome.json as an issue comment.
#   4. Glue job calls actions/transition swarm:spec → swarm:develop.
#
# §8 explicit decision: spec.yml is responsible for the issue comment and artifact only.
# Committing docs/specs/issue-N.md to the feature branch is develop's responsibility (#7) —
# the feature branch does not exist at spec stage.
#
# Idempotency: concurrency group swarm-<issue> with cancel-in-progress: false prevents
# duplicate runs without cancelling an in-flight spec generation.
#
# Permissions per job:
#   agent job : contents: read, issues: read  (action_path resolution + gh issue view)
#   glue job  : contents: read, issues: write (spec comment + label transition)

on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to spec.
        required: true
        type: number
      runner-label:
        description: Runner label for the agent job. Glue jobs always use ubuntu-latest.
        required: false
        type: string
        default: swarm-agent
      dry-run:
        description: When true, log intended mutations without executing them.
        required: false
        type: boolean
        default: false
      adapter:
        description: Agent adapter (claude or openai-compat).
        required: false
        type: string
        default: claude
      model:
        description: LLM model identifier set as SWARM_LLM_MODEL. Consumed by openai-compat; ignored by claude.
        required: false
        type: string
        default: ""
      enabled-sinks:
        description: Reserved — comma-separated notify sinks; wired to transition/notify in a future update.
        required: false
        type: string
        default: ""
      buzz-channel:
        description: Reserved — Buzz/Nostr channel UUID; wired to notify passthrough in a future update.
        required: false
        type: string
        default: ""
      engine-repo:
        description: Engine repository (org/repo). Override for forks.
        required: false
        type: string
        default: benmarte/swarm
      engine-ref:
        description: Engine ref (tag, branch, or SHA) to check out into .swarm-engine/. Must match the ref pinned in the caller uses directive.
        required: false
        type: string
        default: v1
    secrets:
      SWARM_TOKEN:
        description: >
          Fine-grained PAT with issues:write scope for a distinct actor.
          Required for stage-label cascades — GITHUB_TOKEN-written labels do not
          trigger workflow runs (GitHub recursion guard). When absent the
          transition action falls back to GITHUB_TOKEN with a loud warning.
        required: false
      SWARM_LLM_API_KEY:
        description: >
          Bearer token for the OpenAI-compatible LLM endpoint.
          Optional — omit for local endpoints that need no authentication.
        required: false

concurrency:
  group: swarm-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  agent:
    name: Generate spec
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      verdict: ${{ steps.read-outcome.outputs.verdict }}
      spec-body: ${{ steps.read-outcome.outputs.spec-body }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_LLM_MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      - name: Load and validate config
        id: config
        uses: ./.swarm-engine/actions/load-config
        with:
          config-file: swarm.config.yml

      - name: Fetch issue context
        id: ctx
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          context_json="$(gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,labels \
            --repo "$GITHUB_REPOSITORY")"
          delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'json<<%s\n' "$delim"
            printf '%s\n' "$context_json"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run PM agent
        uses: ./.swarm-engine/actions/agent-run
        env:
          SWARM_LLM_BASE_URL: ${{ steps.config.outputs.swarm-llm-base-url }}
          SWARM_LLM_API_KEY: ${{ secrets.SWARM_LLM_API_KEY }}
        with:
          role: pm
          prompt-file: .swarm-engine/prompts/pm.md
          context-json: ${{ steps.ctx.outputs.json }}
          adapter: ${{ inputs.adapter }}
          timeout-minutes: '10'

      - name: Upload outcome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-${{ inputs.issue }}
          path: outcome.json

      - name: Read outcome
        id: read-outcome
        run: |
          verdict="$(jq -r '.verdict' outcome.json)"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          body_delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'spec-body<<%s\n' "$body_delim"
            jq -r '.evidence.spec_body // ""' outcome.json
            printf '\n%s\n' "$body_delim"
          } >> "$GITHUB_OUTPUT"

  post-and-advance:
    name: Post spec and advance
    runs-on: ubuntu-latest
    needs: agent
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine-repo }}
          ref: ${{ inputs.engine-ref }}
          path: .swarm-engine
          persist-credentials: false

      # ── spec: post comment + transition ───────────────────────────────────
      - name: Post spec as issue comment
        if: needs.agent.outputs.verdict == 'spec' && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
          SPEC_BODY: ${{ needs.agent.outputs.spec-body }}
        run: |
          printf '%s' "$SPEC_BODY" > /tmp/spec-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/spec-body.md --repo "$GITHUB_REPOSITORY"

      - name: Transition spec → swarm:develop
        if: needs.agent.outputs.verdict == 'spec' && inputs.dry-run == false
        uses: ./.swarm-engine/actions/transition
        with:
          issue-number: ${{ inputs.issue }}
          from-stage: swarm:spec
          to-stage: swarm:develop
          token: ${{ secrets.SWARM_TOKEN }}

      - name: Dry-run log (spec)
        if: needs.agent.outputs.verdict == 'spec' && inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: verdict=spec — would post spec comment and transition issue #%s from swarm:spec to swarm:develop\n' "$ISSUE_NUMBER"

      # ── escalated: no automatic transition ────────────────────────────────
      - name: Comment escalated
        if: needs.agent.outputs.verdict == 'escalated' && inputs.dry-run == false
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "The PM agent escalated this issue: additional human input is needed before a spec can be produced. Please review and re-queue when resolved." \
            --repo "$GITHUB_REPOSITORY"

      - name: Dry-run log (escalated)
        if: needs.agent.outputs.verdict == 'escalated' && inputs.dry-run == true
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          printf 'dry-run: verdict=escalated — would post escalation comment on issue #%s (no transition)\n' "$ISSUE_NUMBER"

      # ── unexpected verdict: fail loudly ───────────────────────────────────
      - name: Unexpected verdict (fail)
        if: needs.agent.outputs.verdict != 'spec' && needs.agent.outputs.verdict != 'escalated'
        env:
          VERDICT: ${{ needs.agent.outputs.verdict }}
        run: |
          printf 'ERROR: unexpected PM verdict: %s\n' "$VERDICT" >&2
          exit 1
