# sweeper.yml — swarm nightly fleet auditor
#
# Triggers: schedule (default 0 2 * * * — 02:00 UTC nightly) + workflow_dispatch.
# NOT a workflow_call — this is a fleet audit, not an issue-scoped reusable workflow.
#
# Jobs:
#   gather   — collect open issues with swarm:* stage labels + last-activity timestamps
#              via gh api into a context JSON for the orchestrator agent
#   agent    — run orchestrator agent against the context JSON
#   escalate — parse the validated report: comment on stuck issues + apply swarm:needs-human
#              where recommendation=escalate AND the issue is NOT swarm:paused
#
# IMPORTANT CONSTRAINT (SPEC §8.2):
#   The sweeper NEVER touches swarm:paused. It never adds, removes, or reads
#   swarm:paused for any mutation purpose. The only label this workflow's
#   escalate job may add is swarm:needs-human.
#
# dry-run semantics: when dry-run=true, all write steps (comments, label adds,
#   notify) log intent and exit 0. No GitHub mutations are performed.
#
# Caller example (consumer repo cron trigger):
#   on:
#     schedule:
#       - cron: '0 2 * * *'
#     workflow_dispatch:
#       inputs:
#         stall-threshold-hours:
#           description: Hours of inactivity before an issue is considered stuck
#           default: '48'
#         dry-run:
#           description: Log intent only; no GitHub mutations
#           default: 'false'
#   jobs:
#     sweeper:
#       uses: benmarte/swarm/.github/workflows/sweeper.yml@v1
#       with:
#         stall-threshold-hours: ${{ fromJson(inputs.stall-threshold-hours || '48') }}
#         dry-run: ${{ fromJson(inputs.dry-run || 'false') }}
#       secrets: inherit
#
# Permissions per job:
#   gather  : contents: read, issues: read
#   agent   : contents: read, issues: read
#   escalate: contents: read, issues: write

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      stall-threshold-hours:
        description: Hours of inactivity before an issue is considered stuck.
        required: false
        type: number
        default: 48
      runner-label:
        description: Runner label for the agent job. Glue jobs always use ubuntu-latest.
        required: false
        type: string
        default: swarm-agent
      dry-run:
        description: When true, log intended mutations without executing them.
        required: false
        type: boolean
        default: false
      adapter:
        description: Agent adapter (claude or openai-compat).
        required: false
        type: string
        default: claude
      model:
        description: LLM model identifier set as SWARM_LLM_MODEL.
        required: false
        type: string
        default: ""
      enabled-sinks:
        description: Comma-separated notify sinks passthrough (slack,buzz,discord,teams).
        required: false
        type: string
        default: ""
      buzz-channel:
        description: Buzz/Nostr channel UUID passthrough.
        required: false
        type: string
        default: ""

jobs:
  # ── Job 1: gather open swarm:* issues ────────────────────────────────────────
  gather:
    name: Gather swarm issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      context-json: ${{ steps.build-context.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Gather open issues with swarm:* labels
        id: build-context
        env:
          STALL_THRESHOLD_HOURS: ${{ inputs.stall-threshold-hours || 48 }}
        run: |
          # Fetch all open issues. We gather all pages (up to 100 per page).
          # Filter to issues that carry at least one swarm:* label.
          # For each, record: number, title, labels[], updated_at (last-activity proxy).
          issues_raw="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/issues" \
            --method GET \
            --field state=open \
            --field per_page=100 \
            --field labels='swarm:go,swarm:spec,swarm:develop,swarm:qa,swarm:docs,swarm:needs-human,swarm:paused' \
            --jq '[.[] | {
              number: .number,
              title: .title,
              labels: [.labels[].name],
              updated_at: .updated_at
            }]' 2>/dev/null || printf '[]')"

          # Build context JSON with threshold metadata.
          context_json="$(jq -n \
            --argjson issues "$issues_raw" \
            --argjson threshold "${STALL_THRESHOLD_HOURS}" \
            '{stall_threshold_hours: $threshold, issues: $issues}')"

          delim="swarm_$(openssl rand -hex 16)"
          {
            printf 'json<<%s\n' "$delim"
            printf '%s\n' "$context_json"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

  # ── Job 2: orchestrator agent ─────────────────────────────────────────────────
  agent:
    name: Orchestrator agent
    runs-on: ${{ inputs.runner-label || 'swarm-agent' }}
    needs: gather
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      verdict: ${{ steps.read-outcome.outputs.verdict }}
      summary: ${{ steps.read-outcome.outputs.summary }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWARM_LLM_MODEL: ${{ inputs.model || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run orchestrator agent
        uses: ./actions/agent-run
        with:
          role: orchestrator
          prompt-file: ${{ github.workspace }}/prompts/orchestrator.md
          context-json: ${{ needs.gather.outputs.context-json }}
          adapter: ${{ inputs.adapter || 'claude' }}
          timeout-minutes: '10'

      - name: Upload outcome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-sweeper-${{ github.run_id }}
          path: outcome.json

      - name: Read outcome
        id: read-outcome
        run: |
          verdict="$(jq -r '.verdict' outcome.json | tr -d '\n\r')"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          summary="$(jq -r '.evidence.summary // ""' outcome.json | tr -d '\n\r')"
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"

      - name: Enforce verdict=report
        env:
          VERDICT: ${{ steps.read-outcome.outputs.verdict }}
        run: |
          if [ "$VERDICT" != "report" ]; then
            printf 'ERROR: sweeper orchestrator must emit verdict=report, got: %s\n' "$VERDICT" >&2
            exit 1
          fi

  # ── Job 3: escalate stuck issues ──────────────────────────────────────────────
  escalate:
    name: Escalate stuck issues
    runs-on: ubuntu-latest
    needs: agent
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download outcome artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: outcome-sweeper-${{ github.run_id }}

      - name: Parse report and escalate stuck issues
        env:
          DRY_RUN: ${{ inputs.dry-run || false }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          # Parse stuck issue numbers from the orchestrator report.
          # Only issues with recommendation=escalate are processed.
          # CONSTRAINT: This step only ever adds swarm:needs-human.
          # It NEVER references, adds, or removes swarm:paused.
          stuck_issues="$(bash "${WORKSPACE}/scripts/parse-sweeper-report.sh" outcome.json)"

          if [ -z "$stuck_issues" ]; then
            printf 'sweeper: no issues to escalate\n'
            exit 0
          fi

          while IFS= read -r issue_num; do
            issue_num="$(printf '%s' "$issue_num" | tr -d '\n\r')"
            [ -z "$issue_num" ] && continue

            if [ "$DRY_RUN" = "true" ]; then
              printf 'dry-run: would comment on issue #%s (stuck)\n' "$issue_num"
              printf 'dry-run: would apply swarm:needs-human to issue #%s\n' "$issue_num"
              continue
            fi

            # Post stuck comment.
            gh issue comment "$issue_num" \
              --body "**swarm sweeper:** This issue appears to be stuck with no recent activity. Applying \`swarm:needs-human\` for maintainer review." \
              --repo "$GITHUB_REPOSITORY"

            # Apply swarm:needs-human. This is the ONLY label this step may add.
            # swarm:paused is never touched here by design (SPEC §8.2).
            gh issue edit "$issue_num" \
              --add-label "swarm:needs-human" \
              --repo "$GITHUB_REPOSITORY"

            printf 'sweeper: applied swarm:needs-human to issue #%s\n' "$issue_num"
          done <<< "$stuck_issues"

      - name: Build notify event
        id: notify-event
        env:
          SUMMARY: ${{ needs.agent.outputs.summary }}
        run: |
          event_json="$(jq -n \
            --arg event "sweep-report" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --argjson issue 0 \
            --arg stage_from "" \
            --arg stage_to "" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg summary "${SUMMARY}" \
            '{event: $event, repo: $repo, issue: $issue,
              stage_from: $stage_from, stage_to: $stage_to,
              actor: $actor, url: $url, summary: $summary}')"
          printf '%s\n' "$event_json" > /tmp/swarm-sweeper-event.json

      - name: Notify
        if: inputs.dry-run == false
        uses: ./actions/notify
        with:
          event-file: /tmp/swarm-sweeper-event.json
          enabled-sinks: ${{ inputs.enabled-sinks || '' }}
          buzz-channel: ${{ inputs.buzz-channel || '' }}

      - name: Dry-run log (notify)
        if: inputs.dry-run == true
        env:
          SUMMARY: ${{ needs.agent.outputs.summary }}
        run: |
          printf 'dry-run: would notify sinks with sweep-report: %s\n' "$SUMMARY"
