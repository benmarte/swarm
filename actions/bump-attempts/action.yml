name: Bump Attempts
description: >
  Reads the current swarm:attempts:N label (N in 1..3) from the issue and
  increments it (none→1, 1→2, 2→3). At N=3 applies swarm:needs-human,
  assigns the configured maintainer, and emits an escalation event.
  Attempts labels come from a fixed allowlist only.

# permissions required on the calling workflow job:
#   issues: write        — add/remove labels, post comment, assign
#   contents: read       — default; needed so the action_path works
#
# Partial-failure / retry behavior:
#   The remove-old-label and add-new-label gh calls are sequential, not
#   transactional. If the action fails between them, re-running will find
#   the counter reset to its last persisted state (the old label removed
#   but not yet replaced → treated as N=0, so the counter restarts at 1).
#   This is the safe degradation: a retry costs one extra attempt rather
#   than skipping an attempt or silently failing.

inputs:
  issue-number:
    description: The issue number to bump attempts for.
    required: true
  maintainer:
    description: GitHub username to assign when escalating (at attempts=3).
    required: true
  post-comment:
    description: Set to 'false' to suppress the escalation comment.
    required: false
    default: 'true'
  token:
    description: >
      GitHub PAT (SWARM_TOKEN) used for label writes, assignment, and comments.
      Passed as SWARM_TOKEN to bump-attempts.sh which prefers it over GH_TOKEN
      so that swarm:needs-human escalation is authored by a distinct actor.
      When absent the action falls back to GH_TOKEN and emits a warning.
    required: false
    default: ''
  enabled-sinks:
    description: >
      Comma-separated list of notification sinks to fan out to on escalation
      (e.g. "slack,buzz"). Derived from load-config outputs. Empty string
      disables notify fan-out.
    required: false
    default: ''
  buzz-channel:
    description: >
      Nostr/NIP-29 channel UUID for buzz notifications. Passed as BUZZ_CHANNEL
      to bump-attempts.sh which forwards it to the buzz adapter on escalation.
    required: false
    default: ''
  slack-channel:
    description: >
      Slack channel ID for bot-token mode. Passed as SLACK_CHANNEL
      to bump-attempts.sh which forwards it to the slack adapter on escalation.
    required: false
    default: ''
  discord-channel:
    description: >
      Discord channel ID for bot-token mode. Passed as DISCORD_CHANNEL
      to bump-attempts.sh which forwards it to the discord adapter on escalation.
    required: false
    default: ''

outputs:
  needs-human:
    description: >
      'true' if attempts reached the limit and escalation was applied (or was already
      at the limit); 'false' if the counter was incremented but limit not yet reached.
    value: ${{ steps.run.outputs.needs-human }}
  attempt-count:
    description: >
      The current attempt count after this bump (1, 2, or 3).
      Useful for the fix loop to include as attempt_number in SWARM_FIX_CONTEXT.
    value: ${{ steps.run.outputs.attempt-count }}

runs:
  using: composite
  steps:
    - name: Run bump-attempts
      id: run
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        MAINTAINER: ${{ inputs.maintainer }}
        POST_COMMENT: ${{ inputs.post-comment }}
        SWARM_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
        ENABLED_SINKS: ${{ inputs.enabled-sinks }}
        BUZZ_CHANNEL: ${{ inputs.buzz-channel }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
        DISCORD_CHANNEL: ${{ inputs.discord-channel }}
        SWARM_SLACK_WEBHOOK: ${{ env.SWARM_SLACK_WEBHOOK }}
        SWARM_SLACK_BOT_TOKEN: ${{ env.SWARM_SLACK_BOT_TOKEN }}
        SWARM_DISCORD_WEBHOOK: ${{ env.SWARM_DISCORD_WEBHOOK }}
        SWARM_DISCORD_BOT_TOKEN: ${{ env.SWARM_DISCORD_BOT_TOKEN }}
        SWARM_TEAMS_WEBHOOK: ${{ env.SWARM_TEAMS_WEBHOOK }}
        SWARM_BUZZ_RELAY_URL: ${{ env.SWARM_BUZZ_RELAY_URL }}
        SWARM_BUZZ_PRIVATE_KEY: ${{ env.SWARM_BUZZ_PRIVATE_KEY }}
      run: |
        bash "$ACTION_PATH/bump-attempts.sh"
