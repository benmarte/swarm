name: Bump Attempts
description: >
  Reads the current swarm:attempts:N label (N in 1..3) from the issue and
  increments it (none→1, 1→2, 2→3). At N=3 applies swarm:needs-human,
  assigns the configured maintainer, and emits an escalation event.
  Attempts labels come from a fixed allowlist only.

# permissions required on the calling workflow job:
#   issues: write        — add/remove labels, post comment, assign
#   contents: read       — default; needed so the action_path works
#
# Partial-failure / retry behavior:
#   The remove-old-label and add-new-label gh calls are sequential, not
#   transactional. If the action fails between them, re-running will find
#   the counter reset to its last persisted state (the old label removed
#   but not yet replaced → treated as N=0, so the counter restarts at 1).
#   This is the safe degradation: a retry costs one extra attempt rather
#   than skipping an attempt or silently failing.

inputs:
  issue-number:
    description: The issue number to bump attempts for.
    required: true
  maintainer:
    description: GitHub username to assign when escalating (at attempts=3).
    required: true
  post-comment:
    description: Set to 'false' to suppress the escalation comment.
    required: false
    default: 'true'

outputs:
  needs-human:
    description: >
      'true' if attempts reached the limit and escalation was applied (or was already
      at the limit); 'false' if the counter was incremented but limit not yet reached.
    value: ${{ steps.run.outputs.needs-human }}

runs:
  using: composite
  steps:
    - name: Run bump-attempts
      id: run
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        MAINTAINER: ${{ inputs.maintainer }}
        POST_COMMENT: ${{ inputs.post-comment }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/bump-attempts.sh"
