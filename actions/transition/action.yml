name: Transition Stage
description: >
  Swaps one swarm stage label for another (remove old, add new), posts a
  transition comment, and invokes the notify hook (stub until #4 lands).
  Idempotent: if the issue already carries to-stage (and not from-stage),
  exits 0 as a no-op.

# permissions required on the calling workflow job:
#   issues: write        — add/remove labels, post comment
#   contents: read       — default; needed so the action_path works
#
# Partial-failure / retry behavior:
#   The remove-old and add-new label calls are sequential, not transactional.
#   If the action fails between them, re-running recovers cleanly: the
#   idempotency check (to-stage already present → no-op exit 0) prevents
#   duplicate label adds, and a missing from-stage label is tolerated with a
#   warning rather than a hard failure.

inputs:
  issue-number:
    description: The issue number to transition.
    required: true
  from-stage:
    description: >
      The swarm stage label to remove (e.g. swarm:go).
      Must be in the hard-coded stage allowlist.
    required: true
  to-stage:
    description: >
      The swarm stage label to add (e.g. swarm:spec).
      Must be in the hard-coded stage allowlist.
    required: true
  post-comment:
    description: Set to 'false' to suppress the transition comment.
    required: false
    default: 'true'
  token:
    description: >
      GitHub PAT (SWARM_TOKEN) used for label writes and comments.
      Must be a fine-grained PAT with issues:write scope so that the
      resulting label event is authored by a different actor and
      triggers the next stage workflow (GitHub suppresses workflow
      triggers for events caused by GITHUB_TOKEN).
      When absent the action falls back to GH_TOKEN from the job env
      and emits a loud warning: stage cascading will stop.
    required: false
    default: ''
  enabled-sinks:
    description: >
      Comma-separated list of notification sinks to fan out to after the
      transition (e.g. "slack,buzz"). Derived from load-config outputs.
      Empty string disables notify fan-out.
    required: false
    default: ''
  buzz-channel:
    description: >
      Nostr/NIP-29 channel UUID for buzz notifications. Passed as BUZZ_CHANNEL
      to transition.sh which forwards it to the buzz adapter.
    required: false
    default: ''
  slack-channel:
    description: >
      Slack channel ID for bot-token mode. Passed as SLACK_CHANNEL
      to transition.sh which forwards it to the slack adapter.
    required: false
    default: ''
  discord-channel:
    description: >
      Discord channel ID for bot-token mode. Passed as DISCORD_CHANNEL
      to transition.sh which forwards it to the discord adapter.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run transition
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        FROM_STAGE: ${{ inputs.from-stage }}
        TO_STAGE: ${{ inputs.to-stage }}
        POST_COMMENT: ${{ inputs.post-comment }}
        SWARM_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
        ENABLED_SINKS: ${{ inputs.enabled-sinks }}
        BUZZ_CHANNEL: ${{ inputs.buzz-channel }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
        DISCORD_CHANNEL: ${{ inputs.discord-channel }}
        SWARM_SLACK_WEBHOOK: ${{ env.SWARM_SLACK_WEBHOOK }}
        SWARM_SLACK_BOT_TOKEN: ${{ env.SWARM_SLACK_BOT_TOKEN }}
        SWARM_DISCORD_WEBHOOK: ${{ env.SWARM_DISCORD_WEBHOOK }}
        SWARM_DISCORD_BOT_TOKEN: ${{ env.SWARM_DISCORD_BOT_TOKEN }}
        SWARM_TEAMS_WEBHOOK: ${{ env.SWARM_TEAMS_WEBHOOK }}
        SWARM_BUZZ_RELAY_URL: ${{ env.SWARM_BUZZ_RELAY_URL }}
        SWARM_BUZZ_PRIVATE_KEY: ${{ env.SWARM_BUZZ_PRIVATE_KEY }}
      run: |
        bash "$ACTION_PATH/transition.sh"
